:root{
  --navy:#1B2A4A;--blue:#1E86C8;--sky:#EAF4FC;--sky2:#F5FAFE;--orange:#E8952A;--white:#fff;
  --ink:#1B2A4A;--ink2:#46566F;--ink3:#6B7A90;--line:#D5E1EC;--line2:#E8EEF4;--track:#B9D3E8;
  --ph-prove:#C3DFF3;--ph-partner:#7DBBE4;--ph-sell:#1E86C8;--ph-scale:#1B2A4A;
  --good:#1F7A4D;--warn:#9A5B00;--bad:#B3261E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Jakarta",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--white);font-size:15px;line-height:1.5}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-size:30px;line-height:1.12;letter-spacing:-.02em;font-weight:760;margin:0 0 6px;max-width:28ch}
h2{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:720;margin:0 0 6px}
h3{font-size:16px;line-height:1.3;font-weight:700;margin:0 0 6px}
h4{font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--navy)}
p{margin:0 0 10px;max-width:78ch}
.muted{color:var(--ink3)}
.small{font-size:13px}
.cite{font-size:.72em;vertical-align:super;line-height:0;text-decoration:none;margin-left:1px;font-weight:650}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.2) blur(6px)}
.top-in{max-width:1360px;margin:0 auto;padding:10px 28px 0}
.row1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-size:15px;font-weight:760;letter-spacing:-.005em}
.brand span{font-size:12.5px;color:var(--ink3)}
.search{position:relative;width:min(360px,100%)}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px 0 34px;background:var(--sky2)}
.search input:focus{background:#fff;border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(30,134,200,.18)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--ink3)}
.sres{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(27,42,74,.14);padding:6px;display:none;max-height:420px;overflow:auto}
.sres.on{display:block}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:6px;cursor:pointer}
.sres button[aria-selected="true"],.sres button:hover{background:var(--sky)}
.sres .sn{font-weight:650}
.sres .sm{display:block;font-size:12.5px;color:var(--ink3)}
.sres .none{padding:8px;color:var(--ink3);font-size:13.5px}
.ctl{display:flex;align-items:center;gap:8px}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--sky2)}
.seg-ctl button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg-ctl button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:650}
.iconbtn{height:34px;min-width:34px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13.5px}
.iconbtn:hover{border-color:var(--blue)}
.iconbtn svg{width:16px;height:16px}
.row2{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:2px;margin-right:auto;overflow-x:auto;scrollbar-width:none}
.tabs a{display:block;padding:9px 12px 10px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--navy)}
.tabs a[aria-current="page"]{color:var(--navy);border-bottom-color:var(--orange)}
.scen{display:flex;align-items:center;gap:8px;padding-bottom:7px}
.scen>span{font-size:12.5px;color:var(--ink3)}
.hiddenflag{font-size:12.5px;color:var(--warn);padding-bottom:10px}

/* settings panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:50;box-shadow:-12px 0 40px rgba(27,42,74,.18);transform:translateX(105%);transition:transform .18s ease;display:flex;flex-direction:column}
.panel.on{transform:none}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line2)}
.panel-b{padding:16px 20px 30px;overflow:auto;flex:1}
.scrim{position:fixed;inset:0;background:rgba(27,42,74,.28);z-index:45;display:none}
.scrim.on{display:block}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--navy)}
.grp{font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 4px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--navy)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.warn{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:60;display:none}
.toast.on{display:block}

/* main */
main{max-width:1360px;margin:0 auto;padding:26px 28px 80px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.lede{color:var(--ink2);max-width:80ch;margin:0}
.scen-note{font-size:13.5px;color:var(--ink2);background:var(--sky2);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;max-width:60ch}
.scen-note b{color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:6px 0 8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:30px;letter-spacing:-.02em;line-height:1.1;font-weight:760;font-variant-numeric:tabular-nums}
.kpi span{display:block;color:var(--ink2);font-size:14px}
.kpi em{display:block;font-style:normal;color:var(--ink3);font-size:12.5px;margin-top:4px}
.note{font-size:13px;color:var(--ink3);margin:6px 0 0}
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sec{margin-top:26px}

/* timeline */
.tlbox{background:var(--sky);border-radius:14px;padding:14px 16px 12px;margin-top:14px}
.tlbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;vertical-align:-1px;margin-right:5px}
.lg-ph{width:18px;height:10px;border-radius:2px}
.lg-d{width:10px;height:10px;transform:rotate(45deg);background:var(--orange);border:1.5px solid var(--navy)}
.lg-o{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--ink3);background:#fff}
.lg-g{width:3px;height:13px;background:#fff;border:1px solid var(--navy);border-radius:1px}
.tlscroll{overflow-x:auto}
.tl{min-width:880px}
.tl-h,.tl-r{display:grid;grid-template-columns:250px 1fr;align-items:center}
.tl-years{display:grid;grid-template-columns:repeat(4,1fr)}
.tl-y{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--track)}
.tl-y b{grid-column:1/-1;font-size:13.5px;padding-left:8px}

.tl-l{font-size:13.5px;padding:3px 8px 3px 4px;display:flex;gap:7px;align-items:center;min-width:0}
.tl-l a{color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-l a:hover{text-decoration:underline}
.tl-no{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;width:17px;flex:none}
.tl-ed{display:none;gap:2px;margin-left:auto;flex:none}
.editing .tl-ed{display:inline-flex}
.tl-ed button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:12px;line-height:1;color:var(--navy);padding:0}
.tl-ed button:hover{border-color:var(--blue)}
.tl-t{position:relative;height:28px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--track) calc(25% - 1px),var(--track) 25%),repeating-linear-gradient(90deg,transparent 0,transparent calc(6.25% - 1px),rgba(185,211,232,.45) calc(6.25% - 1px),rgba(185,211,232,.45) 6.25%)}
.tseg{position:absolute;top:8px;height:12px;border-right:2px solid var(--sky)}
.tseg.st{border-top-left-radius:4px;border-bottom-left-radius:4px}
.tseg.en{border-top-right-radius:4px;border-bottom-right-radius:4px}
.ph-prove{background:var(--ph-prove)}.ph-partner{background:var(--ph-partner)}.ph-sell{background:var(--ph-sell)}.ph-scale{background:var(--ph-scale)}
.tgate{position:absolute;top:3px;width:3px;height:22px;margin-left:-2px;background:#fff;border:1px solid var(--navy);border-radius:2px}
.tmile{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:var(--orange);border:1.5px solid var(--navy);z-index:2}
.tmo{position:absolute;top:10px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:#fff;border:1.5px solid var(--ink3);z-index:1}
.tout{position:absolute;right:-2px;top:6px;font-size:10.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:15px}
.tl-r.hid{opacity:.45}
.gshift{display:flex;align-items:center;gap:6px;font-size:13px}
.gshift b{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}

/* charts */
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit}
.chart .lab{font-size:12px;fill:var(--ink)}
.chart .val{font-size:11.5px;fill:var(--ink2);font-variant-numeric:tabular-nums}
.chart .ax{font-size:11px;fill:var(--ink3)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+g rect,.chart g.row:hover rect.bar{fill:#156CA3}

/* tooltip */
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:300px;display:none;box-shadow:0 6px 18px rgba(27,42,74,.25)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12.5px;color:var(--ink2);font-weight:650;background:var(--sky2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sel td{background:#FFF8EE}
th button.sort{border:0;background:none;padding:0;font-weight:650;color:inherit;cursor:pointer;font-size:inherit;display:inline-flex;gap:4px;align-items:center}
th button.sort[aria-sort]::after{content:"";border:4px solid transparent;border-top-color:currentColor;margin-top:4px}
th button.sort[aria-sort="ascending"]::after{border-top-color:transparent;border-bottom-color:currentColor;margin-top:-4px}
td.sc-col,th.sc-col{background:#FFF8EE}
.qchip{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.q-do{background:#DDF0E6;color:#165C3A}.q-partner{background:#E1EEFA;color:#174E79}.q-small{background:#FFF0D6;color:#7A4800}.q-park{background:#ECEFF3;color:#46566F}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;font-size:13.5px}
.inp.num{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.inp.tiny{width:52px;text-align:center}
select.inp{padding:5px 6px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(30,134,200,.18)}

/* priority */
.prio{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:22px;align-items:start}
.qgrid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qbox h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.q-do-b{background:#F4FAF6}.q-partner-b{background:#F4F8FD}.q-small-b{background:#FFFBF4}.q-park-b{background:#F8F9FB}
.ctlbox{background:var(--sky2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.ctlbox label{font-size:13.5px}
.rng{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rng input[type=range]{accent-color:var(--navy);width:220px}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-top:8px}
.wgrid div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.wgrid input{width:90px;accent-color:var(--navy)}
.scorebox{margin-top:14px}
.scorebox input{width:44px}

/* products */
.pv{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;align-items:start}
.pv>div{min-width:0}
h1{overflow-wrap:break-word}
.plist{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto;padding-right:4px}
.plist input,.plist select{margin-bottom:8px}
.plist ul{list-style:none;margin:0;padding:0}
.plist .pg{font-size:12px;font-weight:700;color:var(--navy);margin:12px 0 3px}
.plist a{display:flex;gap:7px;padding:5px 8px;border-radius:6px;color:var(--ink2);text-decoration:none;font-size:13.5px;line-height:1.3}
.plist a:hover{background:var(--sky)}
.plist a[aria-current="page"]{background:var(--navy);color:#fff}
.plist a .tl-no{color:inherit;opacity:.7}
.plist a.hid{opacity:.5}
.plist-sel{display:none}
.ph{border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:12px}
.ph-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .lead{color:var(--ink2);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink2);background:#fff}
.chip b{color:var(--navy)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.fact{background:var(--sky2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px}
.fact span{display:block;font-size:12px;color:var(--ink3)}
.fact b{font-size:15.5px;font-variant-numeric:tabular-nums}
.fact .qchip{display:inline-block;margin-right:4px}
.fact small{display:block;font-size:12px;color:var(--ink3)}
.nextact{margin-top:10px;font-size:14px;border-left:3px solid var(--orange);padding:4px 0 4px 10px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto}
.ptabs a{padding:8px 12px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.ptabs a[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.tp{display:none}.tp.on{display:block}
.tp>h2.ptitle{display:none}
.qgrid{display:grid;grid-template-columns:70px repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.qgrid .yh{font-weight:700;font-size:14px;padding-top:8px}
.qgrid .qh{font-size:12px;color:var(--ink3);text-align:left;padding-left:2px}
.qc{border:1px solid var(--line2);border-radius:8px;padding:7px 9px 8px;font-size:13px;line-height:1.42;background:#fff;position:relative;border-top:5px solid var(--line2)}
.qc.ph-prove-b{border-top-color:var(--ph-prove)}.qc.ph-partner-b{border-top-color:var(--ph-partner)}.qc.ph-sell-b{border-top-color:var(--ph-sell)}.qc.ph-scale-b{border-top-color:var(--ph-scale)}
.qc .pt{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px}
.qc .qn{display:none}
.qc .gt{display:block;margin-top:6px;font-size:12px;font-weight:650;color:var(--navy)}
.qc .fi{display:block;margin-top:6px;font-size:12px;font-weight:650;color:#7A4800}
.qc.mt{background:var(--sky2);color:var(--ink3)}
.moved{margin-top:12px;font-size:13px}
.moved li{margin:3px 0}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:3px 0}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.swot>div{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.swot h4{margin-top:2px}
.comps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.comp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.comp h3{margin:0;font-size:15px}
.st{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;align-self:flex-start}
.st-comm{background:#DDF0E6;color:#165C3A}.st-fail{background:#FBE3E1;color:#8A1C14}.st-res{background:#E1EEFA;color:#174E79}.st-pat{background:#ECEFF3;color:#46566F}.st-prog{background:#FFF0D6;color:#7A4800}
.comp p{margin:0;font-size:13.5px}
.comp .opp{background:#FFF8EE;border-left:3px solid var(--orange);padding:6px 9px;border-radius:0 6px 6px 0;font-size:13.5px}
.comp .opp b{display:block;font-size:12px;color:#7A4800}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink3);font-size:13px}
.kv dd{margin:0}
.helix4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.helix4>div{background:var(--sky2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.helix4 b{display:block;font-size:12.5px;color:var(--navy);margin-bottom:3px}
.bar-need{height:10px;border-radius:5px;background:var(--line2);position:relative;overflow:hidden;margin-top:4px;min-width:120px}
.bar-need i{position:absolute;top:0;bottom:0;left:0}
.bar-need i.aw{background:var(--navy)}
.bar-need i.pi{background:var(--ph-partner)}
.stream{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.stream-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.sgrid{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;align-items:flex-end}
.sgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--ink3);gap:3px}
.edited{font-size:11.5px;font-weight:650;color:var(--warn);background:#FFF0D6;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.linklist{list-style:none;padding:0;margin:0}
.linklist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.addrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-top:10px}

/* drawer for timeline editing */
.drow{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.grow{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;margin-bottom:6px;align-items:center}
.frow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:13.5px}

/* guide */
.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.path{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.path .who{font-size:13px;color:var(--ink3);margin-bottom:6px}
.path ol{margin:8px 0 0;padding-left:20px;font-size:13.5px}
.path ol li{margin:2px 0}
.path .ex{font-size:12.5px;color:var(--ink2);margin-top:8px}
.srcs{list-style:none;padding:0;margin:0;counter-reset:none}
.srcs li{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:6px 8px;border-radius:6px;font-size:13.5px}
.srcs li.hl{background:#FFF0D6}
.srcs .sn{color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.srcs a{word-break:break-word}

/* responsive */
@media (max-width:1100px){
  .prio{grid-template-columns:1fr}
  .helix4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .top{position:static}
  .tl-h,.tl-r{grid-template-columns:150px 1fr}
  .tl{min-width:720px}
  .top-in{padding:8px 16px 0}
  main{padding:18px 16px 60px}
  .pv{grid-template-columns:1fr}
  .plist{display:none}
  .plist-sel{display:block;margin-bottom:12px}
  .two,.comps,.facts{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
  .qgrid .qh{display:none}
  .qgrid .yh{padding-top:12px}
  .qc .qn{display:inline;font-weight:650;color:var(--ink2);margin-right:4px}
  h1{font-size:25px}
  .search{order:3;width:100%}
}
@media (max-width:600px){
  .swot,.helix4,.qgrid4{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .addrow{grid-template-columns:1fr}
  .scen>span{display:none}
  .brand span{display:none}
}
@media print{
  .top,.panel,.scrim,.plist,.plist-sel,.ptabs,.btnrow,.noprint,.tl-ed,#tip{display:none!important}
  main{padding:0;max-width:none}
  .pv{display:block}
  .tp{display:block!important;break-inside:auto;margin-bottom:18px}
  .tp>h2.ptitle{display:block;margin-top:14px}
  .tlbox,.fact,.helix4>div{background:#fff!important;border:1px solid var(--line)}
  .tlscroll{overflow:visible}
  .tl{min-width:0}
  a{color:var(--ink)}
  .qc,.comp,.stream{break-inside:avoid}
}

redesigned with a manufacturer so it can be built at a known cost, certified and sold with service. BINUS earns royalties or sells through BINUS Creates.", "id": "Prototipe dirancang ulang bersama produsen agar bisa dibuat dengan biaya yang jelas, disertifikasi, dan dijual beserta layanan purnajual. BINUS memperoleh royalti atau menjual melalui BINUS Creates."}, "steps": [{"en": "Freeze design and bill of materials", "id": "Bekukan desain dan daftar komponen"}, {"en": "Trial with real users", "id": "Uji coba dengan pengguna nyata"}, {"en": "Design for production with the maker", "id": "Rancang untuk produksi bersama produsen"}, {"en": "Certify: SNI, TKDN, wireless where needed", "id": "Sertifikasi: SNI, TKDN, perangkat nirkabel bila perlu"}, {"en": "First batch and first sales", "id": "Produksi dan penjualan pertama"}, {"en": "Service contracts and channels", "id": "Kontrak layanan dan saluran penjualan"}]}, {"id": "P3", "name": {"en": "Run it as a service", "id": "Jalankan sebagai layanan"}, "who": {"en": "Software, data and deployment packages", "id": "Perangkat lunak, data, dan paket implementasi"}, "idea": {"en": "Customers pay every year for an outcome they can use. Revenue comes from packages and renewals.", "id": "Pelanggan membayar setiap tahun untuk hasil yang bisa mereka pakai. Pendapatan berasal dari paket dan perpanjangan."}, "steps": [{"en": "Clean up code, data and content rights", "id": "Rapikan hak atas kode, data, dan konten"}, {"en": "Prove accuracy or impact in the field", "id": "Buktikan akurasi atau dampak di lapangan"}, {"en": "One package, one price, one support SOP", "id": "Satu paket, satu harga, satu SOP dukungan"}, {"en": "Paid pilots", "id": "Uji coba berbayar"}, {"en": "Channel partner that already sells to the customer", "id": "Mitra saluran yang sudah menjual ke pelanggan"}, {"en": "Renewals prove the value", "id": "Perpanjangan membuktikan nilainya"}]}, {"id": "P4", "name": {"en": "Validate clinically first", "id": "Validasi klinis lebih dulu"}, "who": {"en": "Health devices and medical software", "id": "Alat kesehatan dan perangkat lunak medis"}, "idea": {"en": "Under Kepmenkes 951/2026 every software-based medical device needs clinical validation with Indonesian data [kmk951]. No licence is credible until a prospective study shows the device works.", "id": "Berdasarkan Kepmenkes 951/2026, setiap alat kesehatan berbasis perangkat lunak wajib divalidasi klinis dengan data Indonesia [kmk951]. Lisensi baru meyakinkan setelah studi prospektif membuktikan alat bekerja."}, "steps": [{"en": "Fix the intended use and claims", "id": "Tetapkan tujuan penggunaan dan klaim"}, {"en": "Quality system and ethical clearance", "id": "Sistem mutu dan persetujuan etik"}, {"en": "Prospective clinical validation", "id": "Validasi klinis prospektif"}, {"en": "Go or no-go on pre-set thresholds", "id": "Lanjut atau berhenti berdasarkan ambang yang ditetapkan"}, {"en": "Marketing authorization (AKD) or sandbox", "id": "Izin edar (AKD) atau sandbox"}, {"en": "License to a device or health-tech company", "id": "Lisensi ke perusahaan alat kesehatan atau health-tech"}]}, {"id": "P5", "name": {"en": "License a design with a built pilot", "id": "Lisensikan desain dengan rumah contoh"}, "who": {"en": "Architecture and built environment", "id": "Arsitektur dan lingkungan binaan"}, "idea": {"en": "Developers buy evidence, not drawings. One monitored show house turns a registered design into a licensable product.", "id": "Pengembang membeli bukti, bukan gambar. Satu rumah contoh yang dipantau mengubah desain terdaftar menjadi produk yang bisa dilisensikan."}, "steps": [{"en": "Settle co-author rights", "id": "Selesaikan hak rekan pencipta"}, {"en": "Engineer and cost the design", "id": "Hitung teknis dan biaya desain"}, {"en": "Build a show unit with a developer", "id": "Bangun rumah contoh bersama pengembang"}, {"en": "Measure for 12 months", "id": "Ukur selama 12 bulan"}, {"en": "License to developers", "id": "Lisensikan ke pengembang"}]}], "checklist": [{"en": "IP status confirmed: patent application or grant at PDKI, copyright or plant variety certificate numbers, legal owner.", "id": "Status HKI dipastikan: permohonan atau sertifikat paten di PDKI, nomor hak cipta atau PVT, pemilik sah."}, {"en": "People and rights: full inventor and contributor list, plus rights held by co-authors, hospitals, BRIN or other partners.", "id": "Orang dan hak: daftar lengkap inventor dan kontributor, serta hak rekan pencipta, rumah sakit, BRIN, atau mitra lain."}, {"en": "One evidence file: methods, sample sizes and dates. Where figures conflict, keep the latest verified version.", "id": "Satu berkas bukti: metode, jumlah sampel, dan tanggal. Bila angka berbeda, pakai versi terbaru yang terverifikasi."}, {"en": "Cost and price: bill of materials or cost of goods, and a target price checked against comparable products.", "id": "Biaya dan harga: daftar komponen atau harga pokok, serta harga sasaran yang dibandingkan dengan produk sejenis."}, {"en": "Allowed claims: what the product may say today under BPOM, Kemenkes or consumer law.", "id": "Klaim yang diizinkan: apa yang boleh disampaikan saat ini menurut BPOM, Kemenkes, atau hukum perlindungan konsumen."}, {"en": "One owner: an RTT section lead per product and a quarterly review with the inventors.", "id": "Satu penanggung jawab: satu PIC seksi RTT per produk dan tinjauan kuartalan bersama inventor."}], "criteria": {"d": [{"en": "Readiness of the product", "id": "Kesiapan produk"}, {"en": "Quality of evidence", "id": "Kualitas bukti"}, {"en": "Clarity of IP and rights", "id": "Kejelasan HKI dan hak"}, {"en": "Partner already in place", "id": "Mitra sudah ada"}, {"en": "Light regulatory path", "id": "Jalur regulasi ringan"}, {"en": "Low cash need", "id": "Kebutuhan dana kecil"}], "m": [{"en": "Size of need or market", "id": "Besar kebutuhan atau pasar"}, {"en": "Buyer with a budget", "id": "Pembeli punya anggaran"}, {"en": "Room against competitors", "id" egang lisensi, produsen, atau pengembang, tunai atau non-tunai."}}, {"id": "other", "name": "Other research grant", "max": 0, "tkt": "", "cycle": {"en": "[ISI]", "id": "[ISI]"}, "notes": {"en": "International or foundation grants.", "id": "Hibah internasional atau yayasan."}}], "regulatory": [{"type": {"en": "Processed food", "id": "Pangan olahan"}, "req": {"en": "BPOM MD registration: Rp0 for micro and small firms, Rp300,000 per new registration for general categories [bpomfood]. Halal certification. Micro producers may use SPP-IRT for low-risk foods.", "id": "Registrasi BPOM MD: Rp0 untuk usaha mikro dan kecil, Rp300.000 per registrasi baru untuk kategori umum [bpomfood]. Sertifikasi halal. Usaha mikro dapat memakai SPP-IRT untuk pangan berisiko rendah."}, "applies": {"en": "Probiotic powder, Wedang Uwuh, Marshmallow, Crystals", "id": "Bubuk probiotik, Wedang Uwuh, Marshmallow, Kristal"}}, {"type": {"en": "Herbal medicine", "id": "Obat bahan alam"}, "req": {"en": "Jamu (TR), OHT (preclinical evidence, Rp3.7 juta fee) or fitofarmaka (clinical evidence, Rp8 juta fee) [pp15] [fito].", "id": "Jamu (TR), OHT (bukti praklinik, biaya Rp3,7 juta) atau fitofarmaka (bukti klinik, biaya Rp8 juta) [pp15] [fito]."}, "applies": {"en": "Tyherbs", "id": "Tyherbs"}}, {"type": {"en": "Medical devices and AI software", "id": "Alat kesehatan dan perangkat lunak AI"}, "req": {"en": "Izin edar (AKD) held by a licensed company; 21 to 55 days after a complete dossier depending on class [pp28]. AI and software devices need clinical validation with Indonesian data, change control and SATUSEHAT integration; the sandbox requires TKT 9 [kmk951] [sandbox].", "id": "Izin edar (AKD) dipegang perusahaan berizin; 21 sampai 55 hari setelah dokumen lengkap, tergantung kelas [pp28]. Alat berbasis AI dan perangkat lunak wajib validasi klinis dengan data Indonesia, kendali perubahan, dan integrasi SATUSEHAT; sandbox mensyaratkan TKT 9 [kmk951] [sandbox]."}, "applies": {"en": "PediDERM, Kidney detector, TriCheck", "id": "PediDERM, Detektor ginjal, TriCheck"}}, {"type": {"en": "Household appliances", "id": "Peralatan rumah tangga"}, "req": {"en": "Mandatory SNI for kitchen and liquid-heating appliances through SPPT-SNI product certification [sni].", "id": "SNI wajib untuk peralatan dapur dan pemanas cairan melalui sertifikasi produk SPPT-SNI [sni]."}, "applies": {"en": "InEM", "id": "InEM"}}, {"type": {"en": "Government buyers", "id": "Pembeli pemerintah"}, "req": {"en": "Perpres 46/2025: buyers must choose local products with TKDN+BMP of at least 40% when available; minimum TKDN 25% [tkdn]. List on e-Katalog.", "id": "Perpres 46/2025: pembeli wajib memilih produk dalam negeri dengan TKDN+BMP minimal 40% bila tersedia; TKDN minimal 25% [tkdn]. Tayangkan di e-Katalog."}, "applies": {"en": "BEE Braille, MAYA, PusGita", "id": "BEE Braille, MAYA, PusGita"}}, {"type": {"en": "Personal data", "id": "Data pribadi"}, "req": {"en": "UU PDP: consent, data of minors, retention and breach rules.", "id": "UU PDP: persetujuan, data anak, retensi, dan aturan kebocoran data."}, "applies": {"en": "Career Pathway, PediDERM, PusGita, Smart Sawit", "id": "Career Pathway, PediDERM, PusGita, Smart Sawit"}}], "helix": [{"who": {"en": "BINUS", "id": "BINUS"}, "role": {"en": "RTTO: IP, grants, ethics, matching. BINUS Creates: licences, spin-offs, royalties, business development funding from TRL 7. GEE: incubation and investors. CGE: partner networks. KMI: product content. Labs: Maker Innovation Space, Multihelix Hub, FBRC, HealthTech Lab, BINUS Medical School [journey].", "id": "RTTO: HKI, hibah, etik, pencocokan mitra. BINUS Creates: lisensi, spin-off, royalti, dana pengembangan bisnis mulai TRL 7. GEE: inkubasi dan investor. CGE: jejaring mitra. KMI: konten produk. Laboratorium: Maker Innovation Space, Multihelix Hub, FBRC, HealthTech Lab, BINUS Medical School [journey]."}}, {"who": {"en": "Government", "id": "Pemerintah"}, "role": {"en": "Funders (Kemdiktisaintek, BRIN, BPDP), regulator /* ---------------- state ---------------- */
function defState() {
  return { v: 2, lang: "en", scen: "real", hidden: [], gshift: 0, tl: {}, rev: {}, scores: {},

/* ---------------- text helpers ---------------- */
function T(k) { const u = D.ui[S.lang] || D.ui.en; return (k in u) ? u[k] : (D.ui.en[k] || k); }
function L(o) { if (o == null) return ""; if (typeof o === "string") return o; return o[S.lang] || o.en || ""; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function cite(s) {
  return esc(s).replace(/\[([a-z0-9]+)\]/g, (m, k) => {
    const x = SRC[k];
    if (!x) return m;
    return `<a class="cite" href="#/sources/${x.n}" data-tip="${esc("[" + x.n + "] " + x.t)}">[${x.n}]</a>`;
  });
}
function LC(o) { return cite(L(o)); }
function num(v, d) {
  const n = Number(v) || 0;
  return n.toLocaleString(S.lang === "id" ? "id-ID" : "en-US", { maximumFractionDigits: d || 0, minimumFractionDigits: d || 0 });
}
function rpj(v) { return "Rp" + num(Math.round(v)) + " " + (S.lang === "id" ? "juta" : "juta"); }
function rpBig(v) {

}

  if (q < 0) return T("before2027");
  if (q > 15) return T("after2030");
  return "Q" + (q % 4 + 1) + " " + (2027 + Math.floor(q / 4));
}
function short(p) { return L(p.short); }

function isHidden(p) { return S.hidden.indexOf(p.slug) >= 0; }
function shown() { return P.filter(p => !isHidden(p)); }

    seg: o.seg || p.seg,

  return p.streams.map((s, i) => {
    const x = o[i] || {};
    const r = Object.assign({}, s);
    if (x.price != null) r.price = x.price;
    if (x.rate != null) r.rate = x.rate;
    if (s.u) {
      r.u = {};
      SC.forEach(sc => { r.u[sc] = Object.assign({}, s.u[sc], (x.u && x.u[sc]) || {}); });
    }
    return r;
  });
}
function rawIncome(p, ds) {
  const st = streams(p);
  const out = Y.map(() => [0, 0]);
  Y.forEach((y, yi) => {
    st.forEach(s => {
      if (s.k === "u") {
        const n = +(s.u[ds][y] || 0);
        out[yi][0] += s.price * s.rate * n;
        if (s.r && s.rate < 1) out[yi][1] += s.price * n;
      } else {
        const ref = st[s.ref].u[ds];
        let cum = 0;
        Y.forEach(z => { if (s.incl ? z <= y : z < y) cum += +(ref[z] || 0); });
        out[yi][0] += s.price * s.rate * Math.floor(cum / s.per);
      }
    });
  });
  return out;
}
const _inc = {};
function incomeKey(p, sc) { return p.slug + "|" + sc; }
function clearCache() { for (const k in _inc) delete _inc[k]; }
function income(p, sc) {
  const key = incomeKey(p, sc);
  if (_inc[key]) return _inc[key];
  const zero = { y: Y.map(() => [0, 0]), tot: 0, ptot: 0, after: 0, first: null };
  const t = tl(p);
  const f = t.first[sc];
  if (f == null) return (_inc[key] = zero);
  let ds = sc, f0 = p.first[sc];
  if (f0 == null) {
    ds = p.first.opt != null ? "opt" : (p.first.real != null ? "real" : (p.first.pess != null ? "pess" : null));
    if (!ds) return (_inc[key] = Object.assign({}, zero, { first: f + S.gshift }));
    f0 = p.first[ds];
  }
  const d = f + S.gshift - f0;
  const raw = rawIncome(p, ds);
  const q = [];
  for (let i = 0; i < 16; i++) q.push([0, 0]);
  const fy0 = Math.floor(f0 / 4);
  raw.forEach((v, yi) => {
    const start = yi === fy0 ? f0 % 4 : 0;
    const n = 4 - start;
    for (let k = start; k < 4; k++) { q[yi * 4 + k][0] += v[0] / n; q[yi * 4 + k][1] += v[1] / n; }
  });
  const out = [];
  for (let i = 0; i < 16; i++) out.push([0, 0]);
  let after = 0;
  for (let i = 0; i < 16; i++) {
    const j = i + d;
    if (j >= 16) { after += q[i][0]; continue; }
    if (j < 0) continue;
    out[j][0] += q[i][0]; out[j][1] += q[i][1];
  }
  if (d < 0) for (let j = Math.max(0, 16 + d); j < 16; j++) { out[j][0] += q[15][0]; out[j][1] += q[15][1]; }
  const yv = Y.map((y, yi) => [0, 1, 2, 3].reduce((a, k) => [a[0] + out[yi * 4 + k][0], a[1] + out[yi * 4 + k][1]], [0, 0]));
  const tot = yv.reduce((a, v) => a + v[0], 0);
  const ptot = yv.reduce((a, v) => a + v[1], 0);
  return (_inc[key] = { y: yv, tot, ptot, after, first: f + S.gshift });
}
function earns(p, sc) { const f = firstEff(p, sc); return f != null && f <= 15 && income(p, sc).tot > 0.5; }

function scores(p) { const o = S.scores[p.slug] || {}; return { d: o.d || p.scores.d, m: o.m || p.scores.m }; }
function wavg(v, w) { let a = 0, b = 0; v.forEach((x, i) => { a += x * w[i]; b += w[i]; }); return b ? a / b : 0; }
function prio(p) {
  const s = scores(p);
  const dd = wavg(s.d, S.w.d), mm = wavg(s.m, S.w.m);
  const sp = S.w.split / 100;
  const pr = sp * dd + (1 - sp) * mm;
  const q = dd >= 3 ? (mm >= 3 ? "do" : "small") : (mm >= 3 ? "partner" : "park");
  return { d: dd, m: mm, p: pr, q };
}

  const r = {}; arr.forEach((x, i) => { r[x[0]] = i + 1; }); return r;
}

function lines(p) { return S.fund[p.slug] || p.fund; }
function fundSum(p) {

  lines(p).forEach(l => { if (l.st === "rejected") return; n++; if (l.st === "awarded") aw += +l.a || 0; else pi += +l.a || 0; });
  const need = p.cash;
  return { aw, pi, n, need, uns: Math.max(0, need[0] - aw), gap: Math.max(0, need[0] - aw - pi) };
}

/* ---------------- UI state (not saved) ---------------- */

  if (fid && fid !== "q") {
    const el = byId(fid);
    if (el) { el.focus({ preventScroll: true }); try { if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* */ } }
  }
  if (r.v === "sources" && r.a) {
    const li = byId("src-" + r.a);
    if (li) { li.classList.add("hl"); li.scrollIntoView({ block: "center" }); }
  }
  if (U.panel) renderPanel();
  const key = r.v + "/" + r.a;
  if (key !== U.last && !(r.v === "sources" && r.a)) window.scrollTo(0, 0);
  U.last = key;
}

/* ---------------- timeline ---------------- */
function tlHead() {
  return `<div class="tl-h"><div></div><div class="tl-years">${Y.map(y => `<div class="tl-y"><b>${y}</b><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span></div>`).join("")}</div></div>`;
}
function tlRow(p, opts) {
  const t = tl(p), g = S.gshift, nm = short(p);
  let h = "";
  const segs = t.seg.map(s => [s[0] + g, s[1] + g, s[2]]).filter(s => s[1] >= 0 && s[0] <= 15).map(s => [Math.max(0, s[0]), Math.min(15, s[1]), s[2]]);
  segs.forEach((s, i) => {
    const cls = "tseg ph-" + s[2] + (i === 0 ? " st" : "") + (i === segs.length - 1 ? " en" : "");
    const tip = `${nm}: ${T("phase_" + s[2])}, ${ql(s[0])} - ${ql(s[1])}`;
    h += `<span class="${cls}" style="left:${(s[0] / 16 * 100).toFixed(3)}%;width:${((s[1] - s[0] + 1) / 16 * 100).toFixed(3)}%" data-tip="${esc(tip)}"></span>`;
  });
  t.gates.forEach(gt => {
    const q = gt[0] + g;
    if (q < 0 || q > 15) return;
    h += `<span class="tgate" style="left:${((q + 1) / 16 * 100).toFixed(3)}%" data-tip="${esc(nm + ": " + T("gate") + ", " + ql(q) + ". " + L(gt[1]))}"></span>`;
  });
  let outLabel = "";
  SC.forEach(sc => {
    if (sc === S.scen) return;
    const f = firstEff(p, sc);
    if (f == null || f > 15) return;
    const fx = Math.max(0, f);
    h += `<span class="tmo" style="left:${((fx + 0.5) / 16 * 100).toFixed(3)}%" data-tip="${esc(nm + ": " + T("first_income") + ", " + T(sc) + ": " + ql(f))}"></span>`;
  });
  const f = firstEff(p, S.scen);
  if (f != null && f <= 15) {
    const fx = Math.max(0, f);
    h += `<span class="tmile" style="left:${((fx + 0.5) / 16 * 100).toFixed(3)}%" data-tip="${esc(nm + ": " + T("first_income") + ", " + T(S.scen) + ": " + ql(f))}"></span>`;
  } else {
    outLabel = `<span class="tout" data-tip="${esc(nm + ": " + T("first_income") + ", " + T(S.scen) + ": " + ql(f))}">${esc(f == null ? T("not_before") : T("after2030"))}</span>`;
  }
  const ed = opts && opts.noEdit ? "" : `<span class="tl-ed"><button type="button" data-act="shift" data-slug="${p.slug}" data-d="-1" aria-label="${esc(T("earlier") + ": " + nm)}" data-tip="${esc(T("earlier"))}">&#9664;</button><button type="button" data-act="shift" data-slug="${p.slug}" data-d="1" aria-label="${esc(T("later") + ": " + nm)}" data-tip="${esc(T("later"))}">&#9654;</button><button type="button" data-act="drawer" data-slug="${p.slug}" aria-label="${esc(T("edit_phase") + ": " + nm)}" data-tip="${esc(T("edit_phase"))}">&#9998;</button></span>`;
  return `<div class="tl-r${isHidden(p) ? " hid" : ""}"><div class="tl-l"><span class="tl-no">${p.id}</span><a href="#/products/${p.slug}">${esc(nm)}</a>${t.edited ? `<span class="edited" title="${esc(T("edited"))}">*</span>` : ""}${ed}</div><div class="tl-t">${h}${outLabel}</div></div>`;
}
function legend() {

/* ---------------- charts ---------------- */
function niceMax(v) {
  if (v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / p;
  const steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  return steps.find(x => m <= x) * p;
}
function hbar(x, y, w, h, r) {
  if (w <= 0) return "";
  r = Math.min(r, w, h / 2);
  return `M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 -${r},${r}h-${w - r}z`;
}
function vbar(x, y0, w, h, r) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y0}v-${h - r}a${r},${r} 0 0 1 ${r},-${r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${h - r}z`;
}
function chartByProduct(list) {
  const rows = list.map(p => {
    const v = income(p, S.scen).tot;
    const all = SC.map(s => income(p, s).tot);
    return { p, v, lo: Math.min.apply(null, all), hi: Math.max.apply(null, all), all };
  }).sort((a, b) => (b.v - a.v) || (b.hi - a.hi));
  const W = 660, L0 = 178, R0 = 64, rh = 25, top = 6;
  const H = top + rows.length * rh + 26;
  const mx = niceMax(Math.max(1, ...rows.map(r => r.hi)));
  const sx = v => (v / mx) * (W - L0 - R0);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T("rev_by_product"))}">`;
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const x = L0 + sx(mx * f);
    s += `<line x1="${x}" y1="${top}" x2="${x}" y2="${H - 22}" stroke="#E8EEF4"/><text class="ax" x="${x}" y="${H - 7}" text-anchor="middle">${num(mx * f)}</text>`;
  });
  rows.forEach((r, i) => {
    const y = top + i * rh;
    const cy = y + rh / 2;
    let nm = short(r.p);
    if (nm.length > 26) nm = nm.slice(0, 25) + "…";
    const tip = `${short(r.p)}. ${SC.map((sc, k) => T(sc) + ": " + rpj(r.all[k])).join("; ")}`;
    s += `<g class="row"><rect class="hit" x="0" y="${y}" width="${W}" height="${rh}" data-tip="${esc(tip)}"/>`;
    s += `<text class="lab" x="${L0 - 8}" y="${cy + 4}" text-anchor="end">${esc(nm)}</text>`;
    if (r.hi <= 0.5) {
      s += `<text class="val" x="${L0 + 4}" y="${cy + 4}">${esc(T("not_before"))}</text></g>`;
      return;
    }
    s += `<path class="bar" d="${hbar(L0, cy - 6, sx(r.v), 12, 4)}" fill="#1E86C8" pointer-events="none"/>`;
    if (r.hi - r.lo > 0.5) {
      const x1 = L0 + sx(r.lo), x2 = L0 + sx(r.hi);
      s += `<g pointer-events="none" stroke="#46566F" stroke-width="1.5"><line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}"/><line x1="${x1}" y1="${cy - 5}" x2="${x1}" y2="${cy + 5}"/><line x1="${x2}" y1="${cy - 5}" x2="${x2}" y2="${cy + 5}"/></g>`;
    }
    s += `<text class="val" x="${L0 + sx(Math.max(r.v, r.hi)) + 6}" y="${cy + 4}" pointer-events="none">${num(r.v)}</text></g>`;
  });
  return s + "</svg>";
}
function chartByYear(list) {
  const vals = SC.reduce((o, sc) => { o[sc] = Y.map((y, yi) => list.reduce((a, p) => a + income(p, sc).y[yi][0], 0)); return o; }, {});
  const W = 600, H = 300, L0 = 52, B = 30, T0 = 22;
  const mx = niceMax(Math.max(1, ...SC.map(sc => Math.max.apply(null, vals[sc]))));
  const sy = v => (v / mx) * (H - B - T0);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T("rev_by_year"))}">`;
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const y = H - B - sy(mx * f);
    s += `<line x1="${L0}" y1="${y}" x2="${W - 8}" y2="${y}" stroke="#E8EEF4"/><text class="ax" x="${L0 - 6}" y="${y + 4}" text-anchor="end">${num(mx * f)}</text>`;
  });
  const bw = 64, step = (W - L0 - 8) / 4;
  Y.forEach((y, i) => {
    const cx = L0 + step * i + step / 2;
    const v = vals[S.scen][i];
    const lo = Math.min(...SC.map(sc => vals[sc][i])), hi = Math.max(...SC.map(sc => vals[sc][i]));
    const tip = `${y}. ${SC.map(sc => T(sc) + ": " + rpj(vals[sc][i])).join("; ")}`;
    s += `<rect class="hit" x="${cx - step / 2}" y="${T0 - 10}" width="${step}" height="${H - B - T0 + 10}" data-tip="${esc(tip)}"/>`;
    s += `<path d="${vbar(cx - bw / 2, H - B, bw, sy(v), 4)}" fill="#1E86C8" pointer-events="none"/>`;
    if (hi - lo > 0.5) {
      const y1 = H - B - sy(lo), y2 = H - B - sy(hi);
      s += `<g pointer-events="none" stroke="#46566F" stroke-width="1.5"><line x1="${cx}" y1="${y1}" x2="${cx}" y2="${y2}"/><line x1="${cx - 6}" y1="${y1}" x2="${cx + 6}" y2="${y1}"/><line x1="${cx - 6}" y1="${y2}" x2="${cx + 6}" y2="${y2}"/></g>`;
    }
    s += `<text class="val" x="${cx}" y="${H - B - sy(Math.max(v, hi)) - 6}" text-anchor="middle" pointer-events="none">${num(v)}</text>`;
    s += `<text class="lab" x="${cx}" y="${H - 10}" text-anchor="middle">${y}</text>`;
  });
  return s + "</svg>";
}

function scatter(list) {

  const sx = v => L0 + (v - 1) / 4 * (W - L0 - R0);

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T("doability") + " / " + T("market"))}">`;
  const mx = sx(3), my = sy(3);
  s += `<rect x="${mx}" y="${T0}" width="${W - R0 - mx}" height="${my - T0}" fill="#EDF7F1"/>`;
  s += `<rect x="${L0}" y="${T0}" width="${mx - L0}" height="${my - T0}" fill="#EEF5FC"/>`;
  s += `<rect x="${mx}" y="${my}" width="${W - R0 - mx}" height="${H - B - my}" fill="#FFF8EE"/>`;
  s += `<rect x="${L0}" y="${my}" width="${mx - L0}" height="${H - B - my}" fill="#F4F6F8"/>`;

  s += `<text class="lab" transform="translate(14 ${(T0 + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(T("market"))} &#8594;</text>`;

/* ---------------- products ---------------- */
function prodMatches(p, q) {
  if (!q) return true;
  const hay = [p.name.en, p.name.id, L(p.short), p.lead.en, p.id, ...p.partners.map(x => x[1].en), ...p.comps.map(c => c.name.en + " " + c.name.id)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(tk => hay.indexOf(tk) >= 0);
}
function plistUl(cur) {
  let h = "";
  D.pathways.forEach(pw => {
    if (U.pp && U.pp !== pw.id) return;
    const ps = P.filter(p => p.pathway === pw.id && (U.ph || !isHidden(p) || p.slug === cur) && prodMatches(p, U.pf));
    if (!ps.length) return;
    h += `<li class="pg">${esc(L(pw.name))}</li>` + ps.map(p => `<li><a href="#/products/${p.slug}" class="${isHidden(p) ? "hid" : ""}" ${p.slug === cur ? 'aria-current="page"' : ""}><span class="tl-no">${p.id}</span><span>${esc(short(p))}</span></a></li>`).join("");
  });
  return h || `<li class="muted small">${esc(T("no_results"))}</li>`;
}
function qopts(sel, none, lo, hi) {
  lo = Math.min(lo == null ? 0 : lo, sel == null ? 0 : sel); hi = Math.max(hi == null ? 15 : hi, sel == null ? 0 : sel);
  let h = none ? `<option value=""${sel == null ? " selected" : ""}>${esc(T("none"))}</option>` : "";
  for (let q = lo; q <= hi; q++) h += `<option value="${q}"${q === sel ? " selected" : ""}>${esc(ql(q))}</option>`;
  return h;
}
function phaseAt(p, q) {
  const t = tl(p);
  for (const s of t.seg) if (q >= s[0] + S.gshift && q <= s[1] + S.gshift) return s[2];
  return null;
}
function planTab(p) {
  const t = tl(p), off = t.qs + S.gshift;
  const fsel = firstEff(p, S.scen);
  let grid = `<div class="qgrid"><div></div>${[1, 2, 3, 4].map(q => `<div class="qh">Q${q}</div>`).join("")}`;
  Y.forEach((y, yi) => {
    grid += `<div class="yh">${y}</div>`;
    for (let k = 0; k < 4; k++) {
      const q = yi * 4 + k, i = q - off, ph = phaseAt(p, q);
      const txt = i >= 0 && i < 16 ? L(p.q[i]) : "";
      const gates = t.gates.filter(g => g[0] + S.gshift === q).map(g => `<span class="gt">${esc(T("gate"))}: ${esc(L(g[1]))}</span>`).join("");
      const fi = fsel === q ? `<span class="fi">&#9670; ${esc(T("first_income"))} (${esc(T(S.scen))})</span>` : "";
      grid += `<div class="qc${ph ? " ph-" + ph + "-b" : ""}${txt ? "" : " mt"}"><span class="pt">${ph ? esc(T("phase_" + ph)) : "&nbsp;"}</span><span class="qn">Q${k + 1}</span>${txt ? LC(p.q[i]) : "&nbsp;"}${gates}${fi}</div>`;
    }
  });
  grid += "</div>";
  const before = [], after = [];
  p.q.forEach((g, i) => { const q = i + off; if (q < 0) before.push([i, g]); if (q > 15) after.push([i, g]); });
  const orig = i => ql(i);
  const mv = (arr, lab) => arr.length ? `<div class="moved"><h4>${esc(lab)}</h4><ul class="clean">${arr.map(([i, g]) => `<li><span class="muted">${esc(T("goal"))} ${esc(orig(i))}:</span> ${LC(g)}</li>`).join("")}</ul></div>` : "";
  return `<div class="two"><div class="card"><h3>${esc(T("now"))}</h3><p>${LC(p.now)}</p></div><div class="card"><h3>${esc(T("route"))}</h3><p>${LC(p.path)}</p><p class="small muted">${esc(pathName(p.pathway))}</p></div></div>
  <div class="tlbox"><div class="tlbar">${legend()}<div class="ctl noprint"><button type="button" class="btn sm" data-act="shift" data-slug="${p.slug}" data-d="-1">&#9664; ${esc(T("earlier"))}</button><button type="button" class="btn sm" data-act="shift" data-slug="${p.slug}" data-d="1">${esc(T("later"))} &#9654;</button><button type="button" class="btn sm" data-act="drawer" data-slug="${p.slug}">${esc(T("edit_phase"))}</button></div></div><div class="tlscroll"><div class="tl">${tlHead()}${tlRow(p, { noEdit: true })}</div></div></div>
  <h3 class="sec">${esc(T("quarter_goals"))}</h3>${grid}${mv(before, T("goal_earlier"))}${mv(after, T("goal_after"))}
  <div class="two sec"><div class="card"><h3>${esc(T("inventor_asks"))}</h3><ul class="clean">${p.asks.map(a => `<li>${LC(a)}</li>`).join("")}</ul></div><div class="card"><h3>${esc(T("kpi_count"))}</h3><p>${LC(p.kpi)}</p></div></div>`;
}

/* ---------------- mutations ---------------- */
function changed() { save(); clearTimeout(changed._t); changed._t = setTimeout(render, 0); }
function tlMut(slug, fn) {
  const p = BY[slug], t = tl(p);
  const o = { seg: t.seg.map(s => s.slice()), gates: t.gates.map(g => [g[0], g[1]]), first: Object.assign({}, t.first), qs: t.qs };
  fn(o);
  S.tl[slug] = o; changed();
}
function toast(msg) {
  const t = byId("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200);
}
function copyText(txt) {
  const ok = () => toast(T("copied"));
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { toast(txt); }
    document.body.removeChild(ta);
  };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
}

const ON = {
  hide: el => { const s = el.dataset.slug; S.hidden = S.hidden.filter(x => x !== s); if (!el.checked) S.hidden.push(s); changed(); },
  first: el => tlMut(el.dataset.slug, o => { o.first[el.dataset.sc] = el.value === "" ? null : +el.value; }),
  seg: el => tlMut(el.dataset.slug, o => { const f = +el.dataset.f; o.seg[+el.dataset.i][f] = f === 2 ? el.value : +el.value; const s = o.seg[+el.dataset.i]; if (s[1] < s[0]) { if (f === 0) s[1] = s[0]; else s[0] = s[1]; } o.seg.sort((a, b) => a[0] - b[0]); }),
  gate: el => tlMut(el.dataset.slug, o => { const f = +el.dataset.f; o.gates[+el.dataset.i][f] = f === 0 ? +el.value : el.value; }),
  rev: el => {
    const s = el.dataset.slug, i = +el.dataset.i, f = el.dataset.f;
    let v = parseFloat(String(el.value).replace(",", "."));
    if (!isFinite(v) || v < 0) v = 0;
    const o = S.rev[s] = S.rev[s] || {};
    const x = o[i] = o[i] || {};
    if (f === "price") x.price = v;
    else if (f === "rate") x.rate = Math.min(v, 100) / 100;
    else { x.u = x.u || {}; x.u[S.scen] = x.u[S.scen] || {}; x.u[S.scen][el.dataset.y] = Math.round(v); }
    changed();
  },
  score: el => {
    const p = BY[el.dataset.slug], sc = scores(p);
    const o = { d: sc.d.slice(), m: sc.m.slice() };

  fund: el => {

  split: el => { S.w.split = +el.value; save(); byId("wv-split").textContent = `${S.w.split}% / ${100 - S.w.split}%`; byId("prio-out").innerHTML = prioOut(); },
  w: el => { S.w[el.dataset.t][+el.dataset.i] = +el.value; save(); byId("wv-" + el.dataset.t + "-" + el.dataset.i).textContent = el.value; byId("prio-out").innerHTML = prioOut(); },
  pf: el => { U.pf = el.value; const r = route(); byId("plist-ul").innerHTML = plistUl(BY[r.a] ? r.a : (shown()[0] || P[0]).slug); },
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act]) {
    if (b.tagName === "A" && b.dataset.act !== "close") e.preventDefault();
    ACT[b.dataset.act](b, e);
  }
  if (!e.target.closest(".search")) closeSearch();
});
document.addEventListener("change", e => { const el = e.target.closest("[data-on]"); if (el && ON[el.dataset.on]) ON[el.dataset.on](el); });
document.addEventListener("input", e => { const el = e.target.closest("[data-in]"); if (el && IN[el.dataset.in]) IN[el.dataset.in](el); });
byId("scrim").addEventListener("click", closePanel);
byId("importfile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result); const st = o.state || o;
      if (typeof st !== "object" || Array.isArray(st)) throw new Error("bad");
      S = Object.assign(defState(), st); changed(); toast(T("import_done"));
    } catch (err) { toast(T("import_bad")); }
    e.target.value = "";
  };
  rd.readAsText(f);
});

/* ---------------- search ---------------- */
let sIdx = -1;
function searchHits(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const toks = q.split(/\s+/);
  const out = [];
  P.forEach(p => {
    const name = (p.name.en + " " + p.name.id + " " + p.short.en + " " + p.short.id + " " + p.id).toLowerCase();
    const lead = p.lead.en.toLowerCase();
    const partners = p.partners.map(x => x[1].en).join(" ").toLowerCase();
    const comps = p.comps.map(c => c.name.en + " " + c.name.id).join(" ").toLowerCase();
    const all = name + " " + lead + " " + partners + " " + comps + " " + L(p.now).toLowerCase();
    if (!toks.every(t => all.indexOf(t) >= 0)) return;
    let score = 0, why = "";
    if (toks.every(t => name.indexOf(t) >= 0)) score = 3;
    else if (toks.every(t => lead.indexOf(t) >= 0)) { score = 2; why = L(p.lead); }
    else if (toks.every(t => partners.indexOf(t) >= 0)) { score = 1.5; why = T("why_partner") + ": " + p.partners.map(x => L(x[1])).find(w => toks.every(t => w.toLowerCase().indexOf(t) >= 0)) || ""; }
    else if (toks.every(t => comps.indexOf(t) >= 0)) { score = 1.2; why = T("comparables") + ": " + L((p.comps.find(c => toks.every(t => (c.name.en + " " + c.name.id).toLowerCase().indexOf(t) >= 0)) || {}).name); }
    else { score = 1; why = L(p.lead); }
    out.push({ p, score, why });
  });
  return out.sort((a, b) => b.score - a.score).slice(0, 8);
}
function renderSearch() {
  const q = byId("q").value, box = byId("sres");
  if (!q.trim()) { closeSearch(); return; }
  const hits = searchHits(q);
  sIdx = hits.length ? 0 : -1;
  box.innerHTML = hits.length ? hits.map((h, i) => `<button type="button" role="option" data-act="go" data-slug="${h.p.slug}" aria-selected="${i === 0}"><span class="sn">${h.p.id} ${esc(short(h.p))}${isHidden(h.p) ? ` <span class="muted small">(${esc(T("hidden"))})</span>` : ""}</span><span class="sm">${esc((h.why || L(h.p.lead)).slice(0, 110))}</span></button>`).join("") : `<div class="none">${esc(T("no_results"))}</div>`;
  box.classList.add("on");
  byId("q").setAttribute("aria-expanded", "true");
}
function closeSearch() { byId("sres").classList.remove("on"); byId("q").setAttribute("aria-expanded", "false"); }
byId("q").addEventListener("input", renderSearch);
byId("q").addEventListener("focus", () => { if (byId("q").value.trim()) renderSearch(); });
byId("q").addEventListener("keydown", e => {
  const opts = [...byId("sres").querySelectorAll("button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!opts.length) return; e.preventDefault();
    sIdx = (sIdx + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.setAttribute("aria-selected", i === sIdx));
  } else if (e.key === "Enter") {
    if (opts[sIdx]) { e.preventDefault(); ACT.go(opts[sIdx]); byId("q").blur(); }
  } else if (e.key === "Escape") { closeSearch(); byId("q").blur(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); byId("q").focus(); }
  if (e.key === "Escape" && U.panel) closePanel();
});

/* ---------------- tooltip ---------------- */
const tip = byId("tip");
function showTip(el, x, y) {
  const t = el.getAttribute("data-tip"); if (!t) return;
  tip.textContent = t; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
}
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else tip.style.display = "none"; });
document.addEventListener("mousemove", e => { if (tip.style.display === "block") { const el = e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); } });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom); } });
document.addEventListener("focusout", () => { tip.style.display = "none"; });
window.addEventListener("scroll", () => { tip.style.display = "none"; }, { passive: true });

window.addEventListener("hashchange", render);
window.addEventListener("beforeprint", () => { tip.style.display = "none"; });
render();

</script>
